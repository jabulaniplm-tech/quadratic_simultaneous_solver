name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install system deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y unzip curl python3-pip python3-venv

    - name: Create Android SDK directory
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - name: Download Android Commandline Tools (correct layout)
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        TMP_ZIP=/tmp/cmdline-tools.zip
        # Use an up-to-date commandlinetools zip (may need update in future)
        curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" -o $TMP_ZIP
        unzip -q $TMP_ZIP -d /tmp
        # The zip unpacks into /tmp/cmdline-tools (or similar). Move into final 'latest' dir:
        rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv /tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
        rm $TMP_ZIP

    - name: Add sdkmanager to PATH (and show layout)
      run: |
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "Contents of cmdline-tools/latest:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest
        echo "Contents of cmdline-tools/latest/bin:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        echo "Contents of cmdline-tools/latest/lib:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/lib

    - name: Ensure JAVA_HOME is set
      run: |
        echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV
        echo "JAVA_HOME is: $JAVA_HOME"

    - name: Install SDK packages (using explicit sdkmanager path)
      run: |
        # call sdkmanager explicitly to avoid any wrong-sourced 'sdkmanager' in PATH
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;36.1.0"
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Accept licenses
      run: |
        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

    - name: Verify aidl exists
      run: |
        if [ -f "$ANDROID_SDK_ROOT/build-tools/36.1.0/aidl" ]; then
          echo "AIDL OK"
        else
          echo "AIDL NOT FOUND"
          ls -R "$ANDROID_SDK_ROOT/build-tools"
          exit 1
        fi

    - name: Setup python env & install buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      run: |
        source venv/bin/activate
        buildozer -v android debug
