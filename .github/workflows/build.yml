name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-8-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libffi-dev libssl-dev \
          wget  # Added for SDK download
          
    - name: Install Buildozer
      run: |
        pip install buildozer
        pip install Cython==0.29.33
    
    - name: Setup Android SDK and accept licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Download and setup Android command line tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
        mkdir -p android-sdk
        unzip commandlinetools-linux-8512546_latest.zip -d android-sdk
        yes | android-sdk/cmdline-tools/bin/sdkmanager --licenses
      
    - name: Build APK with auto-accept
      run: |
        yes | buildozer -v android debug
      timeout-minutes: 150
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Physics-Solver-APK
        path: bin/*.apk
        retention-days: 7
