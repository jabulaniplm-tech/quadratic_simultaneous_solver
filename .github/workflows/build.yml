name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'  # More stable for Kivy
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-8-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libffi-dev libssl-dev
          
    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer
        pip install Cython==0.29.33  # Stable version
        pip install setuptools
      
    - name: Build APK with retry
      run: |
        buildozer -v android clean  # Clean previous attempts
        yes | buildozer -v android debug
      timeout-minutes: 150
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Physics-Solver-APK
        path: bin/*.apk
        retention-days: 7
