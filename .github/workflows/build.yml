name: Android Build (Buildozer)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Buildozer Dependencies (Crucial for Android compilation)
      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          # Install necessary packages including openjdk-17-jdk for Android SDK
          sudo apt install -y \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            git

      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install Buildozer
      - name: Install Buildozer and Kivy
        run: |
          pip install --upgrade pip setuptools
          # Install Buildozer
          pip install buildozer
          # Assuming you also need Kivy/KivyMD for local execution, though Buildozer handles mobile dependencies.
          # If Kivy/KivyMD is not needed for the CI step, this can be skipped.
          # pip install kivy kivymd

      # 4. Cache the .buildozer folder (speeds up subsequent builds significantly)
      - name: Set up Buildozer cache
        uses: actions/cache@v4
        with:
          path: ./.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 5. Run Buildozer to create the debug APK
      # The 'android debug' command will download the necessary Android SDK, NDK, and tools
      - name: Build Android Debug APK
        run: buildozer android debug

      # 6. Upload the generated APK as an artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-solver-android-apk
          path: bin/*.apk
          retention-days: 7
