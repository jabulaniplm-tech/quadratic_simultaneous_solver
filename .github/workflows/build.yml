name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install system deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y unzip curl python3-pip python3-venv

    - name: Create Android SDK directory
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

    - name: Download Android Commandline Tools
      run: |
        cd $ANDROID_SDK_ROOT
        curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" -o tools.zip
        unzip -q tools.zip -d cmdline-tools
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
        rm tools.zip

    - name: Add sdkmanager to PATH
      run: |
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Install SDK packages
      run: |
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;36.1.0"

    - name: Accept licenses
      run: |
        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

    - name: Verify aidl exists
      run: |
        if [ -f "$ANDROID_SDK_ROOT/build-tools/36.1.0/aidl" ]; then
          echo "AIDL OK"
        else
          echo "AIDL NOT FOUND"
          ls -R "$ANDROID_SDK_ROOT/build-tools"
          exit 1
        fi

    - name: Setup python env & install buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      run: |
        source venv/bin/activate
        buildozer -v android debug
