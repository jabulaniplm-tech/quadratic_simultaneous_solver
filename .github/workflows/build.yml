name: Build Android APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        sudo apt-get install -y git zip unzip openjdk-17-jdk
        sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev
        sudo apt-get install -y libncurses-dev cmake libffi-dev libssl-dev
          
    - name: Install Buildozer
      run: pip install buildozer Cython
    
    - name: Build APK with auto-license acceptance
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log
      timeout-minutes: 120
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Physics-Solver-APK
        path: bin/*.apk
        retention-days: 7
